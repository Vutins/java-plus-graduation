server:
  port: 9090
spring:
  application:
    name: stats-server
  config:
    import: "configserver:"
  cloud:
    config:
      fail-fast: true
      retry:
        max-interval: 30000
        useRandomPolicy: true
      discovery:
        enabled: true
        service-id: config-server
eureka:
  instance:
    preferIpAddress: true
    instance-id: "${spring.application.name}:${random.value}"
    hostname: localhost
  client:
    serviceUrl:
      defaultZone: http://localhost:8761/eureka/