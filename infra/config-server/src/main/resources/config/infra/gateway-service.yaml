server:
  port: 8080

  cloud:
    config:
      discovery:
        enabled: true

    gateway:
      discovery:
        locator:
          enabled: true
          lowerCaseServiceId: true

      routes:
        - id: admin-categories-route
          uri: lb://CATEGORY-SERVICE
          predicates:
            - Path=/admin/categories/**

        - id: admin-compilations-route
          uri: lb://COMPILATION-SERVICE
          predicates:
            - Path=/admin/compilations/**

        - id: admin-events-route
          uri: lb://EVENT-SERVICE
          predicates:
            - Path=/admin/events/**

        - id: admin-comments-route
          uri: lb://COMMENT-SERVICE
          predicates:
            - Path=/admin/comments/**

        - id: admin-users-route
          uri: lb://MAIN-SERVICE
          predicates:
            - Path=/admin/users/**

        - id: private-events-route
          uri: lb://MAIN-SERVICE
          predicates:
            - Path=/users/*/events/**

        - id: private-requests-route
          uri: lb://MAIN-SERVICE
          predicates:
            - Path=/users/*/requests/**

        - id: private-reviews-route
          uri: lb://MAIN-SERVICE
          predicates:
            - Path=/users/*/reviews/**

        - id: public-categories-route
          uri: lb://MAIN-SERVICE
          predicates:
            - Path=/categories/**

        - id: public-compilations-route
          uri: lb://MAIN-SERVICE
          predicates:
            - Path=/compilations/**

        - id: public-events-route
          uri: lb://MAIN-SERVICE
          predicates:
            - Path=/events/**

        - id: public-reviews-route
          uri: lb://MAIN-SERVICE
          predicates:
            - Path=/reviews/**

management:
  endpoint:
    gateway:
      enabled: true
  endpoints:
    web:
      exposure:
        include: health,info,gateway