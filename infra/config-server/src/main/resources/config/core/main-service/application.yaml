server:
  port: 0

spring:
  application:
    name: main-service
  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://localhost:5432/main
    username: main
    password: main
    initialization-mode: always
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        formate_sql: true
  sql:
    init:
      mode: always

client:
  url: http://localhost:9090

